<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><link rel="stylesheet" href="/style.css"></head><body><main>
<div class="card"><h1>🔥 Admin Panel</h1><input id="pw" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Sign in</button></div>
<div id="panel" class="hidden"><div class="card"><h2>Orders</h2><div id="orders"></div></div><div class="card"><h2>Payment & Store Settings</h2><input id="storeName" placeholder="Store name"><input id="upiId" placeholder="UPI ID"><input id="qrImageUrl" placeholder="Payment QR image URL"><button class="btn" onclick="saveSettings()">Save settings</button></div><div class="card"><h2>Add / Edit Product</h2><input id="pid" placeholder="ID (leave blank for new)"><input id="name" placeholder="Name"><input id="category" placeholder="Category"><input id="price" type="number" placeholder="Selling price"><input id="original_price" type="number" placeholder="Original price"><input id="description" placeholder="Description"><input id="stock" type="number" placeholder="Stock"><input id="badge" placeholder="Badge"><button class="btn" onclick="saveProduct()">Save product</button></div></div>
</main><script>
let pw="";
async function api(url,opt={}){opt.headers={...(opt.headers||{}),"x-admin-password":pw,"Content-Type":"application/json"};return fetch(url,opt)}
async function login(){pw=document.querySelector("#pw").value;let r=await api("/api/admin/orders");if(!r.ok)return alert("Wrong password");document.querySelector("#panel").classList.remove("hidden");renderOrders(await r.json())}
function renderOrders(os){document.querySelector("#orders").innerHTML=os.map(o=>`<div class="product"><b>#${o.id} ${o.item_name||""}</b><p>UID: ${o.uid} • ₹${o.amount} • ${o.status}</p><select onchange="status(${o.id},this.value)"><option>${o.status}</option><option>approved</option><option>completed</option><option>rejected</option><option>pending</option></select></div>`).join("")}
async function status(id,s){await api("/api/admin/orders/"+id+"/status",{method:"POST",body:JSON.stringify({status:s})});login()}
async function saveSettings(){await api("/api/admin/settings",{method:"POST",body:JSON.stringify({storeName:storeName.value,upiId:upiId.value,qrImageUrl:qrImageUrl.value})});alert("Saved")}
async function saveProduct(){let p={id:pid.value||null,name:name.value,category:category.value,price:+price.value,original_price:+original_price.value,description:description.value,stock:+stock.value,badge:badge.value,active:true};await api("/api/admin/products",{method:"POST",body:JSON.stringify(p)});alert("Product saved")}
</script></body></html>
